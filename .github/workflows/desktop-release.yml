name: Desktop Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing version tag; leave blank to release the selected branch commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Resolve exact release commit
        id: commit
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$commit"
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Resolve release version
        id: version
        run: node scripts/release-version.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.commit }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
      - run: pnpm run typecheck
      - run: pnpm test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned pnpm on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: npm install --global pnpm@11.6.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: runner.os != 'macOS' || runner.arch != 'X64'
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build desktop application
        run: pnpm run build:desktop
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      - name: Check desktop renderer and document worker
        run: pnpm run test:desktop
      - name: Package application
        run: pnpm run package:desktop --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          cd release
          sha256sum ./*.exe ./*.dmg ./*.zip > SHA256SUMS.txt
          if [[ "$RELEASE_TAG" == commit-* ]] && ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" --silent
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_COMMIT"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            options=()
            if [ "$PRERELEASE" = "true" ]; then
              options+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --draft --generate-notes \
              --title "$RELEASE_COMMIT" "${options[@]}" \
              --notes "Windows installers are unsigned; macOS builds are ad-hoc signed and not notarized."
          fi
          gh release upload "$RELEASE_TAG" ./*.exe ./*.dmg ./*.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_COMMIT" --draft=false
